<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enlaces del curso · IoT con Arduino</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<main>
  <h1>Internet de las Cosas (IoT) con Arduino para proyectos escolares</h1>
  <p class="sub">Todos los enlaces del día. Guarda esta página en favoritos: <b>Ctrl + D</b>.</p>
  <nav class="tabs"><a href="index.html" aria-current="page">Enlaces</a><a href="prompts.html">Prompts</a><a href="prototipos.html">Prototipos</a></nav>
  <div id="secciones"></div>
  <footer>Facilitador: Oscar Llerena</footer>
</main>
<script>
// Para agregar un enlace: reemplaza null por la URL entre comillas.
const SECCIONES = [
  { titulo: "Al empezar", color: "--accent", links: [
    { texto: "Check-in 1", nota: "Asistencia del Bloque 1 (nombre y DNI) y 5 preguntas rápidas que no van a la nota. Abierto 15 min.", url: "https://docs.google.com/forms/d/e/1FAIpQLSdhXI5bpod_ZKAHMkpJPuTeCXVfa-xQ4UwoNwV-KXnclo4d5w/viewform" },
    { texto: "Wokwi", nota: "El simulador: entra con “Sign in” y tu Gmail", url: "https://wokwi.com" },
    { texto: "ThingSpeak", nota: "La nube: entra con el correo y la contraseña que creaste en casa", url: "https://thingspeak.mathworks.com" },
    { texto: "Gemini", nota: "La IA: entra con tu Gmail", url: "https://gemini.google.com" },
    { texto: "Fundamentos teóricos", nota: "La teoría de todo el curso, en PDF: para leer o descargar", url: "fundamentos-teoricos.pdf" },
    { texto: "Guía de laboratorios", nota: "Paso a paso de los 7 laboratorios, en PDF", url: "guia-laboratorios.pdf" },
  ]},
  { titulo: "Bloque 1 · Herramientas y Hola IoT", color: "--b1", links: [
    { texto: "Laboratorio 1 · Hola IoT", nota: "Abre el proyecto y usa ▼ junto a SAVE → “Save a copy”", url: "https://wokwi.com/projects/479340521469914113" },
  ]},
  { titulo: "Bloque 2 · Diseñar e implementar con IA", color: "--b2", links: [
    { texto: "Check-in 2", nota: "Asistencia del Bloque 2 (DNI) y 1 pregunta. Abierto 15 min.", url: "https://docs.google.com/forms/d/e/1FAIpQLSdPEOjZymxNWtPwITBnQeyueY04hOFLJqmMqP1MzvHLpiaIpw/viewform" },
    { texto: "Prompts", nota: "Los prompts RCTFR de cada laboratorio, listos para copiar", url: "prompts.html" },
    { texto: "Laboratorio 2 · Semáforo de confort", nota: "Proyecto de partida", url: "https://wokwi.com/projects/479340717393217537" },
    { texto: "Laboratorio 3 · Proyecto con fallas", nota: "Encuentra las 3 fallas", url: "https://wokwi.com/projects/479340892033575937" },
  ]},
  { titulo: "Bloque 3 · Estación y control de temperatura", color: "--b3", links: [
    { texto: "Check-in 3", nota: "Asistencia del Bloque 3 (DNI) y 1 pregunta. Abierto 15 min.", url: "https://docs.google.com/forms/d/e/1FAIpQLSd9KlrkD64z_o4rxzzMOhl_EzHRWYdFFw48bPqxgSWADIfnUw/viewform" },
    { texto: "Prototipos", nota: "Tarjetas con piezas, conexiones, campos de ThingSpeak y proyectos de partida y de rescate", url: "prototipos.html" },
  ]},
  { titulo: "Bloque 4 · Iluminación, alerta y entrega", color: "--b4", links: [
    { texto: "Check-in 4", nota: "Asistencia del Bloque 4 (DNI) y 1 pregunta. Abierto 15 min.", url: "https://docs.google.com/forms/d/e/1FAIpQLScQ0bCtqE_4GB9hnUvjmWMbkFYoNFwalat42_CgE8UN8BA50Q/viewform" },
    { texto: "Form de salida", nota: "Código y encuesta corta", url: "https://docs.google.com/forms/d/e/1FAIpQLSeFym1qLVwecBn1QQCZcSnjAOldRLfPwAt7oUFnYGscvQwEZA/viewform" },
    { texto: "Form de entrega", nota: "4 enlaces de Wokwi + 4 canales públicos · hasta las 23:59 · vale el último envío", url: "https://docs.google.com/forms/d/e/1FAIpQLSdyT0LApTNpWhzq5C3GMxfpPhOssE0l904AfJQkGdXGxX26oQ/viewform" },
  ]},
];
const cont = document.getElementById("secciones");
for (const s of SECCIONES) {
  const sec = document.createElement("section");
  sec.style.setProperty("--c", `var(${s.color})`);
  const h = document.createElement("h2");
  h.innerHTML = `<i style="background:var(${s.color})"></i>`;
  h.append(s.titulo);
  const lista = document.createElement("div");
  lista.className = "links";
  for (const l of s.links) {
    const el = document.createElement(l.url ? "a" : "span");
    el.className = "btn";
    if (l.url) { el.href = l.url; if (/^https?:/.test(l.url)) { el.target = "_blank"; el.rel = "noopener"; } }
    const t = document.createElement("span");
    t.textContent = l.texto;
    if (l.nota) { const n = document.createElement("small"); n.textContent = l.nota; t.append(n); }
    el.append(t);
    lista.append(el);
  }
  sec.append(h, lista);
  cont.append(sec);
}
</script>
</body>
</html>
